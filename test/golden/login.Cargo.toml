[package]
name = "login"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "query", "json", "form"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
deadpool-sqlite = { version = "0.14", features = ["bundled"] }
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
rand = "0.9"
bcrypt = "0.17"
