[package]
name = "login"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "query", "json", "form"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tikv-jemallocator = "0.6"
rusqlite = { version = "0.42", features = ["bundled", "hooks", "functions"] }
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
rand = "0.9"
bcrypt = "0.17"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

# One codegen unit with fat LTO; not `panic = "abort"`, so a panicking request still answers 500.
[profile.release]
lto = "fat"
codegen-units = 1
